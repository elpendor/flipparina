name: Build

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (none = build only, no release)
        type: choice
        options: [none, patch, minor, major]
        default: none

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version from the latest tag
        id: next
        run: |
          last=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "Last: ${last:-none}, next: $major.$minor.$patch"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: official-release
            sdk-channel: release
          - name: official-dev
            sdk-channel: dev
          - name: momentum-release
            sdk-channel: release
            sdk-index-url: https://up.momentum-fw.dev/firmware/directory.json
    steps:
      - uses: actions/checkout@v4

      # The Flipper only stores major.minor
      - name: Stamp the version
        if: inputs.bump != 'none'
        run: |
          v=${{ needs.version.outputs.version }}
          sed -i "s/fap_version=\"[^\"]*\"/fap_version=\"${v%.*}\"/" application.fam
          grep fap_version application.fam

      - name: Build with ufbt
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.3
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
          sdk-index-url: ${{ matrix.sdk-index-url }}

      - name: Rename .fap for its firmware
        run: |
          mkdir -p out
          for f in ${{ steps.build.outputs.fap-artifacts }}; do
            cp "$f" "out/$(basename "$f" .fap)-${{ matrix.name }}.fap"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: flipparina-${{ matrix.name }}
          path: out/*.fap

  release:
    name: Release
    if: inputs.bump != 'none'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flipparina-*-release
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*.fap
          generate_release_notes: true
