name: Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release the top version in docs/changelog.md
        type: boolean
        default: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version and notes from the changelog
        id: read
        run: |
          v=$(grep -m1 '^## ' docs/changelog.md | sed 's/^## //')
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Top heading of docs/changelog.md must be a version like '## 1.2.0', got '$v'"
            exit 1
          fi
          if [ "${{ inputs.release }}" = true ] && git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::v$v is already released; add a new version heading to docs/changelog.md"
            exit 1
          fi
          awk '/^## / { n++; next } n == 1' docs/changelog.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No notes under '## $v' in docs/changelog.md"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"; cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: official-release
            sdk-channel: release
          - name: official-dev
            sdk-channel: dev
          - name: momentum-release
            sdk-channel: release
            sdk-index-url: https://up.momentum-fw.dev/firmware/directory.json
    steps:
      - uses: actions/checkout@v4

      # The Flipper only stores major.minor
      - name: Stamp the version
        if: inputs.release
        run: |
          v=${{ needs.version.outputs.version }}
          sed -i "s/fap_version=\"[^\"]*\"/fap_version=\"${v%.*}\"/" application.fam
          grep fap_version application.fam

      - name: Build with ufbt
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.3
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
          sdk-index-url: ${{ matrix.sdk-index-url }}

      - name: Rename .fap for its firmware
        run: |
          mkdir -p out
          for f in ${{ steps.build.outputs.fap-artifacts }}; do
            cp "$f" "out/$(basename "$f" .fap)-${{ matrix.name }}.fap"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: flipparina-${{ matrix.name }}
          path: out/*.fap

  release:
    name: Release
    if: inputs.release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flipparina-*-release
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*.fap
          body_path: notes.md
