name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: official-release
            sdk-channel: release
          - name: official-dev
            sdk-channel: dev
          - name: momentum-release
            sdk-channel: release
            sdk-index-url: https://up.momentum-fw.dev/firmware/directory.json
    steps:
      - uses: actions/checkout@v4

      - name: Build with ufbt
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.3
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
          sdk-index-url: ${{ matrix.sdk-index-url }}

      - name: Rename .fap for its firmware
        run: |
          mkdir -p out
          for f in ${{ steps.build.outputs.fap-artifacts }}; do
            cp "$f" "out/$(basename "$f" .fap)-${{ matrix.name }}.fap"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: flipparina-${{ matrix.name }}
          path: out/*.fap

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.fap
          generate_release_notes: true
